[package]
name = "mission-control-app"
description = "The prebuilt Mission Control binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The binary's restart test hook (see `main.rs`). Enabled for the tests by the dev-dependency
# below; never part of a normal build.
test-hooks = []

[dependencies]
# Checks IGNITE_SECRET_KEY before the `ignite` console starts (MIT OR Apache-2.0). The version
# Ignite uses.
base64 = "0.22"
mission-control = { path = "../mission-control" }
mission-control-core = { path = "../mission-control-core" }
# The admin panel, whose migrations (the `users`, roles and sessions tables) the installer runs
# before the core ones (MIT). `sqlite` and `postgres` add the drivers beside MySQL and MariaDB.
# Built on Orbit 0.4, the same Orbit as Mission Control, so its `Database` is Mission Control's.
ignite-panel = { version = "0.5.0", features = ["postgres", "sqlite"] }
log = "0.4"
# Opens the database the installer's database step tests, and runs the core migrations.
orbit-orm.workspace = true
# Encodes the user name, password and database name in the DATABASE_URL the installer builds
# (MIT OR Apache-2.0). The version already in the lock.
percent-encoding = "2.3"
# Renders the installer's views (MIT). The version the themes use.
propel_runtime = "0.3.0"
rocket = "0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The database's error code, to tell a wrong password from a missing database. Orbit's own sqlx
# version.
sqlx = { version = "0.9", default-features = false }
# Zeroes the database URL (it holds the password) the installer keeps between steps (Apache-2.0
# OR MIT).
zeroize = "1"

[dev-dependencies]
# Turns on `test-hooks` for the binary the integration tests run.
mission-control-app = { path = ".", features = ["test-hooks"] }
# Encodes HTTP Basic credentials in the REST authentication tests.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Makes the JPEG uploads of the media tests.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Gravatar hashes in the users tests.
sha2 = "0.11"
mission-control-testing = { path = "../mission-control-testing" }
tempfile = "3"
