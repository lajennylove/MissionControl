[package]
name = "mission-control-core"
description = "Content, users, hooks and configuration for Mission Control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[dependencies]
# Filters post HTML on save to WordPress's kses allow-lists (MIT OR Apache-2.0); parses with
# html5ever, as a browser does.
ammonia = "4.2"
# Decodes HTTP Basic credentials and encodes application password hashes (MIT OR Apache-2.0).
base64 = "0.22"
# BLAKE2b for application password hashes, as WordPress 6.8's `wp_fast_hash` (MIT OR Apache-2.0).
blake2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The IANA timezone names, to check the `timezone_string` setting as WordPress checks it against
# `timezone_identifiers_list` (MIT OR Apache-2.0; its `phf` dependency is MIT).
chrono-tz = { version = "0.10", default-features = false }
# Reads legacy Office (OLE compound) files to check their type (MIT). The version `infer` uses.
cfb = "0.14"
# Transliterates titles to ASCII slugs (BSD-3-Clause).
deunicode = "1.6"
dotenvy = "0.15"
fs4 = "1.1.0"
# The operating system's CSPRNG, for application passwords (MIT OR Apache-2.0).
getrandom = "0.4"
# `catch_unwind` on the scheduler's tick future.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Decodes, resizes and encodes image sub-sizes (MIT OR Apache-2.0). Only the four web formats
# WordPress resizes by default; no rayon.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# The field kinds of custom fields (`FieldKindDef`), shared with the admin panel (MIT). Built on
# Orbit 0.4, the same Orbit as Mission Control.
ignite-core = "0.6.1"
# Detects a file's real type from its magic numbers (MIT; its `cfb` dependency is MIT).
infer = "0.22"
# The logging facade Rocket 0.5 logs through.
log = "0.4"
# MD5 for the `Content-MD5` upload check, as WordPress checks it (MIT OR Apache-2.0). The version
# sqlx already builds.
md-5 = "0.11"
orbit-orm.workspace = true
# The parsed template type `propel_runtime::Loader::template` returns (MIT).
propel_parser = "0.3.0"
# Renders themes from disk, confined to the theme and its parent (MIT).
propel_runtime = "0.3.0"
# A plugin manifest's `version` and `requires` (the host API it needs), with Cargo's version and
# requirement syntax (MIT OR Apache-2.0).
semver = "1"
serde = { version = "1", features = ["derive"] }
# SHA-256 for Gravatar addresses, as WordPress 6.8 hashes emails (MIT OR Apache-2.0). A version
# already in the lock.
sha2 = "0.11"
# Scheduled event payloads are stored as JSON.
serde_json = "1"
# Constant-time comparison of password hashes (BSD-3-Clause).
subtle = "2.6"
# The `Decode` and `Type` traits, so `PostStatus` reads from a row. Orbit's own sqlx version.
sqlx = { version = "0.9", default-features = false }
# Parses `theme.toml` manifests (MIT OR Apache-2.0). `preserve_order` keeps the menu locations and
# widget areas in the order the theme writes them, as `register_nav_menus` and `register_sidebar`
# keep them.
toml = { version = "0.9", default-features = false, features = ["parse", "preserve_order", "serde", "std"] }
# The scheduler's background loop, and blocking threads for hook callbacks.
tokio = { workspace = true, features = ["time"] }
# Version 4 UUIDs for application passwords, as `wp_generate_uuid4` (MIT OR Apache-2.0).
uuid = { version = "1", features = ["v4"] }
# Runs plugins: WebAssembly components in a sandbox, linked through the WIT interface in
# `wit/` (Apache-2.0 WITH LLVM-exception; Ruling R98). Only the component model, the Cranelift
# compiler and the runtime: no async, no WAT text, no cache, no profiling.
wasmtime = { version = "50.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
# Reads plugin zips on install (MIT). Only stored and deflated entries, inflated by flate2 with
# its zlib-rs backend, both already in the lock: no bzip2, deflate64, lzma, xz, zstd, ppmd, AES or
# time. The tests write their zips with it too.
zip = { version = "9.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Zeroes plain application passwords and their random bytes when dropped (Apache-2.0 OR MIT).
zeroize = "1"

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` and `O_NONBLOCK`, to open a theme manifest without following a link or blocking on
# a FIFO (MIT OR Apache-2.0).
libc = "0.2"

[dev-dependencies]
mission-control-testing = { path = "../mission-control-testing" }
tempfile = "3"
# Compiles the sample plugins, written in the component model's text format, to binary
# components (Ruling R99). The version wasmtime 50 parses with.
wat = "=1.261.0"
