[package]
name = "mission-control"
description = "The Mission Control library entry point"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The admin panel (MIT), mounted at `/mc-admin` on MySQL and MariaDB. `sqlite` and `postgres` add
# the drivers beside MySQL and MariaDB, as Orbit's own features do for the workspace.
ignite-panel = { version = "0.5.0", features = ["postgres", "sqlite"] }
# The logging facade Rocket 0.5 logs through.
log = "0.4"
mission-control-core = { path = "../mission-control-core" }
orbit-orm.workspace = true
# Reads multipart upload bodies (MIT). The version and feature Rocket's forms use.
multer = { version = "3", features = ["tokio-io"] }
# Render limits for theme templates, set once at start (MIT).
propel_runtime = "0.3.0"
rocket = "0.5.2"
tokio.workspace = true
# The REST discovery documents.
serde_json = "1"
