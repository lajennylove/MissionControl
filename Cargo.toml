[workspace]
resolver = "2"
members = [
    "crates/mission-control",
    "crates/mission-control-core",
    "crates/mission-control-app",
    "crates/mission-control-testing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/lajennylove/MissionControl"
publish = false

[workspace.dependencies]
# From crates.io. The three drivers MC supports, and the `OrbitModel` derive.
orbit-orm = { version = "0.4.0", default-features = false, features = ["derive", "mysql", "postgres", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
