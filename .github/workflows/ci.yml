name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.database }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            url: sqlite
          - database: mariadb
            url: mysql://root:ci-password@127.0.0.1:3306/mission_control_test
          - database: postgres
            url: postgres://postgres:ci-password@127.0.0.1:5432/mission_control_test
    # Both service containers start for every entry (the matrix only picks the
    # URL the tests use). Throwaway passwords: they exist only for the job.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-password
          MARIADB_DATABASE: mission_control_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: mission_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Select test database
        env:
          MATRIX_URL: ${{ matrix.url }}
        run: |
          if [ "${{ matrix.database }}" = "sqlite" ]; then
            echo "MC_TEST_DATABASE_URL=sqlite://${RUNNER_TEMP}/mission-control-test.db?mode=rwc" >> "$GITHUB_ENV"
          else
            echo "MC_TEST_DATABASE_URL=${MATRIX_URL}" >> "$GITHUB_ENV"
          fi
      - name: Test
        run: cargo test --workspace
      - name: Test (release)
        if: matrix.database == 'sqlite'
        run: cargo test --workspace --release

  systemd-unit:
    name: systemd unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # `systemd-analyze verify` checks that ExecStart exists and is executable. It does not
      # check the user or WorkingDirectory. A stub binary at the ExecStart path stands in for
      # the real one (verify does not run it), so this job needs no Rust build.
      - name: Put a stub binary at the ExecStart path
        run: |
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/mission-control-app > /dev/null
          sudo chmod 0755 /usr/local/bin/mission-control-app
      # verify can print warnings (unknown keys, bad values) and still exit 0, so any output
      # fails the job.
      - name: Verify the unit
        run: |
          output="$(sudo systemd-analyze verify "$PWD/deploy/mission-control.service" 2>&1)" || status=$?
          printf '%s\n' "$output"
          test -z "$output" && test "${status:-0}" -eq 0
      - name: The unit restarts after a clean exit
        run: grep -qx 'Restart=always' deploy/mission-control.service

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Build only: the image is never pushed.
      - name: Build the image
        run: docker build --tag mission-control:ci .
      - name: Starts in setup mode with no configuration
        run: |
          docker run -d --name mc --restart unless-stopped -p 8000:8000 mission-control:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/wp-admin/install.php -o /dev/null && exit 0
            sleep 1
          done
          docker logs mc
          exit 1
